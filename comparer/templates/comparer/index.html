{% extends "comparer/base.html" %}
{% load static %}

{% block title %}Weather Compare - Home{% endblock %}

{% block content %}
<div class="card p-4">
    <form id="weather-form" method="POST" action="{% url 'comparer:index' %}">
        {% csrf_token %}
        <div class="row mb-4">
            <div class="col-md-4">
                <label for="city-count-dropdown" class="form-label">Number of cities:</label>
                <select id="city-count-dropdown" class="form-select">
                    <option value="1">1 city</option>
                    <option value="2">2 cities</option>
                    <option value="3">3 cities</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3" id="city-1">
                <label for="city_name_1" class="form-label">City 1:</label>
                <input type="text" name="city_name_1" id="city_name_1" class="form-control" value="{{ submitted_city1|default:'' }}" placeholder="e.g., London" required>
            </div>
            <div class="col-md-4 mb-3 d-none" id="city-2">
                <label for="city_name_2" class="form-label">City 2:</label>
                <input type="text" name="city_name_2" id="city_name_2" class="form-control" value="{{ submitted_city2|default:'' }}" placeholder="e.g., New York">
            </div>
            <div class="col-md-4 mb-3 d-none" id="city-3">
                <label for="city_name_3" class="form-label">City 3:</label>
                <input type="text" name="city_name_3" id="city_name_3" class="form-control" value="{{ submitted_city3|default:'' }}" placeholder="e.g., Tokyo">
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <button type="submit" id="submit-button" class="btn btn-primary w-100">Compare Weather</button>
            </div>
        </div>
    </form>
</div>

        <!-- Processing Indicator -->
        <div class="processing-indicator" id="processing-indicator">
            <div class="spinner"></div>
            <span>Processing weather data...</span>
        </div>

        <div id="results"></div>

        {% if error_message %}
            <p class="error-message">{{ error_message }}</p>
        {% endif %}
{% endblock %}

{% block extra_js %}
    <script src="{% static 'comparer/js/form_controls.js' %}"></script>
    <script src="{% static 'comparer/js/autocomplete.js' %}"></script>
    <script src="{% static 'comparer/js/main_charts.js' %}"></script>
    <script>
    // Async form submission and dynamic rendering
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('weather-form');
        const results = document.getElementById('results');
        const processingIndicator = document.getElementById('processing-indicator');
        const submitButton = document.getElementById('submit-button');

        function showProcessing() {
            processingIndicator.classList.add('show');
            if (submitButton) submitButton.disabled = true;
            // Use the global function from form_controls.js
            window.showLoadingState();
        }
        function hideProcessing() {
            processingIndicator.classList.remove('show');
            if (submitButton) submitButton.disabled = false;
            // Use the global function from form_controls.js
            window.hideLoadingState();
        }

        /**
         * Gather city names from input fields
         * @returns {Array} Array of city names
         */
        function gatherCityNames() {
            const cities = [];
            for (let i = 1; i <= 3; i++) {
                const input = document.getElementById('city_name_' + i);
                if (input && input.value.trim()) {
                    cities.push(input.value.trim());
                }
            }
            return cities;
        }
        
        /**
         * Render weather cards based on API data
         * @param {Object} data - API response data
         * @returns {string} HTML for weather cards
         */
        function renderWeatherCards(data) {
            if (!data.weather_cards_data || data.weather_cards_data.length === 0) {
                return '<p class="error-message">No weather data found.</p>';
            }
            
            let cardsHtml = '<h2>Current Weather</h2>';
            
            cardsHtml += '<div class="row">';
            
            // Add each weather card
            for (const card of data.weather_cards_data) {
                cardsHtml += '<div class="col-md-4 mb-4">';
                if (card.error) {
                    cardsHtml += `
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">${card.name}</h5>
                                <p class="card-text text-danger">${card.error}</p>
                            </div>
                        </div>
                    `;
                } else {
                    cardsHtml += `
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">${card.name}</h5>
                                <h6 class="card-subtitle mb-2 text-muted">${card.day_date}</h6>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <span class="display-4">${parseFloat(card.temperature).toFixed(1)}&deg;</span>
                                        <span class="text-muted">${card.temp_unit}</span>
                                    </div>
                                    <div>
                                        <i class="${card.weather_icon} fa-3x"></i>
                                    </div>
                                </div>
                                <p class="card-text">${card.weather_description}</p>
                                <ul class="list-group list-group-flush">
                                    <li class="list-group-item d-flex justify-content-between">
                                        <span><i class="fas fa-tint"></i> Humidity</span>
                                        <strong>${card.humidity}%</strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between">
                                        <span><i class="fas fa-wind"></i> Wind</span>
                                        <strong>${card.wind_display}</strong>
                                    </li>
                                </ul>
                                ${card.address ? `<div class="card-footer text-muted"><small>${card.address}</small></div>` : ''}
                            </div>
                        </div>
                    `;
                }
                cardsHtml += '</div>';
            }
            
            cardsHtml += '</div>';
            return cardsHtml;
        }
        
        /**
         * Render charts based on API data
         * @param {Object} data - API response data
         * @returns {string} HTML for charts
         */
        function renderCharts(data) {
            if (!data.city_data_for_chart || data.city_data_for_chart.length === 0) {
                return '';
            }
            
            const chartsHtml = `
                <h2>Historical Weather Comparison (5-Year Average)</h2>
                <div class="charts-container">
                    <div class="chart-wrapper">
                        <h3>Average Monthly Temperature Comparison</h3>
                        <canvas id="temperatureChart"></canvas>
                    </div>
                    <div class="chart-wrapper">
                        <h3>Total Monthly Precipitation Comparison</h3>
                        <canvas id="precipitationChart"></canvas>
                    </div>
                </div>
            `;
            
            // Initialize charts after rendering
            setTimeout(() => {
                window.renderWeatherCharts && window.renderWeatherCharts(
                    ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
                    data.city_data_for_chart
                );
            }, 0);
            
            return chartsHtml;
        }
        
        // Handle form submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            results.innerHTML = '';
            showProcessing();

            // Gather city names
            const cities = gatherCityNames();
            if (cities.length === 0) {
                hideProcessing();
                results.innerHTML = '<p class="error-message">Please enter at least one city.</p>';
                return;
            }

            try {
                const response = await fetch('/api/weather-compare/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': form.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify({ cities })
                });
                const data = await response.json();
                hideProcessing();

                if (data.error) {
                    results.innerHTML = '<p class="error-message">' + data.error + '</p>';
                    return;
                }

                // Render weather cards
                results.innerHTML = renderWeatherCards(data);
                
                // Render charts if we have data
                const chartsHtml = renderCharts(data);
                if (chartsHtml) {
                    results.innerHTML += chartsHtml;
                }
                
            } catch (err) {
                hideProcessing();
                console.error('Weather data fetch error:', err);
                results.innerHTML = '<p class="error-message">Error fetching weather data. Please try again later.</p>';
            }
        });
    });
    </script>
{% endblock %}
